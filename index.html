<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ServiPDF Pro - Prueba de descarga</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: #f3f4f6; padding: 2rem; font-family: sans-serif; }
    .card { background: white; border-radius: 1rem; padding: 2rem; max-width: 700px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .btn { padding: 0.5rem 1rem; border-radius: 0.5rem; border: none; cursor: pointer; font-weight: 600; margin-right: 0.5rem; }
    .btn-blue { background: #3b82f6; color: white; }
    .btn-green { background: #22c55e; color: white; }
    .btn-yellow { background: #eab308; color: white; }
    .btn-red { background: #ef4444; color: white; }
    .log { background: #1e293b; color: #e2e8f0; padding: 1rem; border-radius: 0.5rem; font-family: monospace; font-size: 0.8rem; height: 200px; overflow-y: auto; margin-top: 1rem; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="text-2xl font-bold mb-4">🧪 Prueba de descarga</h1>
    <p class="text-gray-600 mb-4">Haz clic en los botones para probar diferentes métodos de descarga.</p>

    <div class="flex flex-wrap gap-2 mb-4">
      <button id="btnBlob" class="btn btn-blue">📥 Método 1: Blob + anchor</button>
      <button id="btnWindow" class="btn btn-green">🪟 Método 2: window.open</button>
      <button id="btnData" class="btn btn-yellow">📄 Método 3: data: URI</button>
      <button id="btnIframe" class="btn btn-red">🖼️ Método 4: iframe</button>
    </div>

    <div class="mt-4">
      <button id="btnPpt" class="btn btn-blue w-full" style="background:#2563eb;">📥 Descargar PowerPoint (desde PDF)</button>
    </div>

    <div id="logArea" class="log">⏳ Esperando acción...</div>
  </div>

  <script>
    // ============================================================
    // 1. Helper para mostrar logs en el área y consola
    // ============================================================
    const logArea = document.getElementById('logArea');
    function log(msg) {
      const timestamp = new Date().toLocaleTimeString();
      const line = `[${timestamp}] ${msg}`;
      logArea.textContent += line + '\n';
      logArea.scrollTop = logArea.scrollHeight;
      console.log(line);
    }

    // ============================================================
    // 2. Funciones de descarga (métodos nativos)
    // ============================================================

    // Método 1: Blob + anchor (el más común)
    function downloadWithAnchor(blob, filename) {
      if (!blob || blob.size === 0) {
        log('❌ Blob inválido o vacío');
        return false;
      }
      try {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 200);
        log(`✅ Método anchor: descarga iniciada (${blob.size} bytes)`);
        return true;
      } catch (e) {
        log(`❌ Error en anchor: ${e.message}`);
        return false;
      }
    }

    // Método 2: window.open
    function downloadWithWindowOpen(blob, filename) {
      if (!blob || blob.size === 0) {
        log('❌ Blob inválido o vacío');
        return false;
      }
      try {
        const url = URL.createObjectURL(blob);
        const win = window.open(url, '_blank');
        if (!win) {
          log('⚠️ window.open bloqueado por el navegador. Probando anchor...');
          return downloadWithAnchor(blob, filename);
        }
        // Forzar descarga en algunos navegadores
        setTimeout(() => {
          try {
            const a = win.document.createElement('a');
            a.href = url;
            a.download = filename;
            win.document.body.appendChild(a);
            a.click();
          } catch (e) {
            log(`⚠️ No se pudo forzar descarga en window.open: ${e.message}`);
          }
        }, 100);
        log(`✅ window.open: ventana abierta (${blob.size} bytes)`);
        return true;
      } catch (e) {
        log(`❌ Error en window.open: ${e.message}`);
        return false;
      }
    }

    // Método 3: data: URI (para texto pequeño)
    function downloadWithDataURI(text, filename) {
      try {
        const dataUri = 'data:text/plain;charset=utf-8,' + encodeURIComponent(text);
        const a = document.createElement('a');
        a.href = dataUri;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => document.body.removeChild(a), 200);
        log(`✅ data: URI descargado (${text.length} caracteres)`);
        return true;
      } catch (e) {
        log(`❌ Error en data: URI: ${e.message}`);
        return false;
      }
    }

    // Método 4: iframe
    function downloadWithIframe(blob, filename) {
      if (!blob || blob.size === 0) {
        log('❌ Blob inválido o vacío');
        return false;
      }
      try {
        const url = URL.createObjectURL(blob);
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = url;
        document.body.appendChild(iframe);
        // Forzar descarga después de cargar
        iframe.onload = function() {
          try {
            iframe.contentWindow.location.href = url;
          } catch (e) {
            log(`⚠️ No se pudo forzar descarga en iframe: ${e.message}`);
          }
          setTimeout(() => {
            document.body.removeChild(iframe);
            URL.revokeObjectURL(url);
          }, 1000);
        };
        log(`✅ iframe: descarga intentada (${blob.size} bytes)`);
        return true;
      } catch (e) {
        log(`❌ Error en iframe: ${e.message}`);
        return false;
      }
    }

    // ============================================================
    // 3. Botones de prueba
    // ============================================================

    // Botón 1: Blob + anchor
    document.getElementById('btnBlob').addEventListener('click', function() {
      log('🔹 Probando método 1: Blob + anchor');
      const blob = new Blob(['Contenido de prueba (anchor)\nFecha: ' + new Date().toISOString()], { type: 'text/plain' });
      const ok = downloadWithAnchor(blob, 'prueba_anchor.txt');
      if (!ok) log('❌ Falló el método 1');
    });

    // Botón 2: window.open
    document.getElementById('btnWindow').addEventListener('click', function() {
      log('🔹 Probando método 2: window.open');
      const blob = new Blob(['Contenido de prueba (window.open)\nFecha: ' + new Date().toISOString()], { type: 'text/plain' });
      const ok = downloadWithWindowOpen(blob, 'prueba_window.txt');
      if (!ok) log('❌ Falló el método 2');
    });

    // Botón 3: data: URI
    document.getElementById('btnData').addEventListener('click', function() {
      log('🔹 Probando método 3: data: URI');
      const text = 'Contenido de prueba (data URI)\nFecha: ' + new Date().toISOString();
      const ok = downloadWithDataURI(text, 'prueba_data.txt');
      if (!ok) log('❌ Falló el método 3');
    });

    // Botón 4: iframe
    document.getElementById('btnIframe').addEventListener('click', function() {
      log('🔹 Probando método 4: iframe');
      const blob = new Blob(['Contenido de prueba (iframe)\nFecha: ' + new Date().toISOString()], { type: 'text/plain' });
      const ok = downloadWithIframe(blob, 'prueba_iframe.txt');
      if (!ok) log('❌ Falló el método 4');
    });

    // ============================================================
    // 4. Botón de descarga de PowerPoint (con PDF)
    // ============================================================
    // (Aquí solo incluiremos una versión mínima que genere un blob de prueba,
    //  porque la conversión real requiere pdf.js y JSZip, y queremos probar
    //  primero la descarga. Si los botones de prueba funcionan, entonces
    //  el problema está en la conversión, no en la descarga.)

    document.getElementById('btnPpt').addEventListener('click', function() {
      log('🔹 Intentando descargar PowerPoint de prueba (blob con texto)');
      // Crear un blob que simule un PPTX (en realidad es un archivo de texto)
      const blob = new Blob(['Este es un PowerPoint de prueba (falso)'], { type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' });
      const ok = downloadWithAnchor(blob, 'prueba_powerpoint.pptx');
      if (!ok) log('❌ Falló la descarga del PowerPoint de prueba');
    });

    // ============================================================
    // 5. Mensaje inicial
    // ============================================================
    log('✅ Página cargada. Prueba los botones.');
    log('ℹ️ Si algún botón funciona, la descarga es posible.');
    log('ℹ️ Si ninguno funciona, revisa la consola (F12) para más detalles.');
  </script>
</body>
</html>
