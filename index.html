<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Prueba descarga</title>
</head>
<body>
  <button id="btnTest">1. Descargar archivo de prueba</button>
  <button id="btnPpt">2. Descargar PowerPoint (con PDF)</button>
  <br><br>
  <input type="file" id="pdfInput" accept=".pdf" multiple />
  
  <div id="log" style="border:1px solid #ccc; padding:10px; height:200px; overflow:auto; margin-top:20px; font-family: monospace; background: #f9f9f9;"></div>

  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <script>
    // 🔴 SOLUCIÓN 1: Configurar el Worker de PDF.js (OBLIGATORIO)
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const log = msg => {
      const el = document.getElementById('log');
      el.innerHTML += `<div>${msg}</div>`;
      el.scrollTop = el.scrollHeight;
    };

    function downloadBlob(blob, name) {
      if (!blob) { log('❌ Blob nulo'); return false; }
      if (blob.size === 0) { log('❌ Blob vacío'); return false; }
      try {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
        log('✅ Descarga iniciada con éxito: ' + name);
        return true;
      } catch (e) {
        log('❌ Error al forzar la descarga: ' + e.message);
        return false;
      }
    }

    // Prueba de descarga básica
    document.getElementById('btnTest').addEventListener('click', function() {
      const blob = new Blob(['Hola mundo. Esto es una prueba de que el navegador permite descargas.'], { type: 'text/plain' });
      downloadBlob(blob, 'prueba_basica.txt');
    });

    // PDF a PowerPoint
    let pdfFiles = [];
    document.getElementById('pdfInput').addEventListener('change', function(e) {
      pdfFiles = Array.from(e.target.files).filter(f => f.name.toLowerCase().endsWith('.pdf'));
      log('📂 PDFs cargados en memoria: ' + pdfFiles.length);
    });

    document.getElementById('btnPpt').addEventListener('click', async function() {
      if (pdfFiles.length === 0) { alert('Selecciona al menos un archivo PDF primero.'); return; }
      log('⚙️ Iniciando generación...');
      
      try {
        if (typeof pdfjsLib === 'undefined') throw new Error('pdf.js no está cargado correctamente');
        if (typeof JSZip === 'undefined') throw new Error('JSZip no está cargado correctamente');
        
        const pptxBlob = await pdfToPowerPoint(pdfFiles);
        log('📦 Blob final generado. Tamaño: ' + pptxBlob.size + ' bytes');
        
        // Disparamos la descarga
        downloadBlob(pptxBlob, 'prueba.pptx');
        
      } catch (err) {
        log('❌ Error crítico: ' + err.message);
        console.error(err);
      }
    });

    // Función pdfToPowerPoint simplificada (solo para probar)
    async function pdfToPowerPoint(pdfFiles) {
      const JSZip = window.JSZip;
      const pptx = new JSZip();
      const slideUrls = [];
      
      for (let idx = 0; idx < pdfFiles.length; idx++) {
        const file = pdfFiles[idx];
        log('📄 Procesando: ' + file.name);
        
        const pdfBytes = await file.arrayBuffer();
        
        // 🔴 SOLUCIÓN 2: Pasar los datos envueltos en un Uint8Array
        const loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(pdfBytes) });
        const pdf = await loadingTask.promise;
        const totalPages = pdf.numPages;
        
        log('📑 Páginas detectadas: ' + totalPages);
        
        for (let p = 1; p <= totalPages; p++) {
          log('🖼️ Renderizando página ' + p + ' a imagen...');
          const page = await pdf.getPage(p);
          const scale = 1.5; 
          const viewport = page.getViewport({ scale });
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          
          await page.render({ canvasContext: ctx, viewport }).promise;
          
          const jpgBlob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.8));
          if (!jpgBlob) throw new Error('Falló la conversión del canvas a JPG');
          
          const jpgBytes = await jpgBlob.arrayBuffer();
          const relName = `ppt/media/slide${slideUrls.length + 1}.jpg`;
          pptx.file(relName, jpgBytes);
          slideUrls.push({ width: viewport.width / scale, height: viewport.height / scale });
          log('✅ Página ' + p + ' procesada correctamente.');
        }
      }
      
      if (slideUrls.length === 0) throw new Error('No se pudo extraer ninguna diapositiva válida.');
      
      // Devolvemos el Blob falso para confirmar que la cadena funciona
      return new Blob(['Este es un archivo de prueba. Se procesaron ' + slideUrls.length + ' imágenes internamente.'], { type: 'text/plain' });
    }
  </script>
</body>
</html>
