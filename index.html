<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test de Descarga</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; }
    button { padding: 0.75rem 1.5rem; font-size: 1rem; cursor: pointer; background: #2563eb; color: white; border: none; border-radius: 0.5rem; }
    button:hover { background: #1d4ed8; }
    #log { margin-top: 1rem; background: #f1f5f9; padding: 1rem; border-radius: 0.5rem; white-space: pre-wrap; font-family: monospace; max-height: 300px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>Test de descarga</h1>
  <button id="btnTest">Descargar archivo de prueba</button>
  <div id="log">Esperando acción...</div>

  <script>
    const log = document.getElementById('log');
    function addLog(msg) {
      log.innerHTML += msg + '\n';
      console.log(msg);
    }

    document.getElementById('btnTest').addEventListener('click', function() {
      addLog('⏳ Iniciando descarga...');
      try {
        // Crear un blob simple con texto
        const contenido = 'Este es un archivo de prueba generado por ServiPDF Pro.';
        const blob = new Blob([contenido], { type: 'text/plain' });
        addLog('✅ Blob creado, tamaño: ' + blob.size + ' bytes');

        // Crear URL y forzar descarga
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'archivo_prueba.txt';
        document.body.appendChild(a);
        addLog('✅ Elemento <a> creado y añadido al DOM');

        a.click();
        addLog('✅ click() ejecutado');

        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          addLog('✅ Limpieza completada');
        }, 100);

        addLog('🎯 Descarga iniciada (deberías ver el archivo en tu carpeta de descargas)');
      } catch (err) {
        addLog('❌ ERROR: ' + err.message);
        console.error(err);
      }
    });
  </script>
</body>
</html>
